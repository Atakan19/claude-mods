name: Feature request
description: Suggest an improvement or a new mod
labels: [enhancement]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options: [cockpit, lean, new mod, other]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
