name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options: [cockpit, marketplace / install, other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `claude --version`, the mod version, your OS"
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Mod options changed from the defaults
